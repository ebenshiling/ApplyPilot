services:
  applypilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applypilot-dashboard
    user: "1000:1000"
    ports:
      - "8765:8765"
    environment:
      APPLYPILOT_DIR: /data/workspace
      APPLYPILOT_MULTI_ROOT: /data/multi
      APPLYPILOT_NZ_ENABLED: "1"
      PYTHONUNBUFFERED: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      LLM_SCORE_PROVIDER: ${LLM_SCORE_PROVIDER:-}
      LLM_SCORE_MODEL: ${LLM_SCORE_MODEL:-}
      LLM_SCORE_REASONING_EFFORT: ${LLM_SCORE_REASONING_EFFORT:-}
      LLM_SCORE_THINKING_BUDGET: ${LLM_SCORE_THINKING_BUDGET:-}
      LLM_SUMMARY_PROVIDER: ${LLM_SUMMARY_PROVIDER:-}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-}
      LLM_SUMMARY_REASONING_EFFORT: ${LLM_SUMMARY_REASONING_EFFORT:-}
      LLM_SUMMARY_THINKING_BUDGET: ${LLM_SUMMARY_THINKING_BUDGET:-}
      LLM_TAILOR_PROVIDER: ${LLM_TAILOR_PROVIDER:-}
      LLM_TAILOR_MODEL: ${LLM_TAILOR_MODEL:-}
      LLM_TAILOR_REASONING_EFFORT: ${LLM_TAILOR_REASONING_EFFORT:-}
      LLM_TAILOR_REASONING_TOKEN_ALLOWANCE: ${LLM_TAILOR_REASONING_TOKEN_ALLOWANCE:-}
      LLM_TAILOR_THINKING_BUDGET: ${LLM_TAILOR_THINKING_BUDGET:-}
      LLM_STATEMENT_PROVIDER: ${LLM_STATEMENT_PROVIDER:-}
      LLM_STATEMENT_MODEL: ${LLM_STATEMENT_MODEL:-}
      LLM_STATEMENT_REASONING_EFFORT: ${LLM_STATEMENT_REASONING_EFFORT:-}
      LLM_STATEMENT_REASONING_TOKEN_ALLOWANCE: ${LLM_STATEMENT_REASONING_TOKEN_ALLOWANCE:-}
      LLM_STATEMENT_THINKING_BUDGET: ${LLM_STATEMENT_THINKING_BUDGET:-}
      LLM_COVER_PROVIDER: ${LLM_COVER_PROVIDER:-}
      LLM_COVER_MODEL: ${LLM_COVER_MODEL:-}
      LLM_COVER_REASONING_EFFORT: ${LLM_COVER_REASONING_EFFORT:-}
      LLM_COVER_REASONING_TOKEN_ALLOWANCE: ${LLM_COVER_REASONING_TOKEN_ALLOWANCE:-}
      LLM_COVER_THINKING_BUDGET: ${LLM_COVER_THINKING_BUDGET:-}
      LLM_REVIEW_PROVIDER: ${LLM_REVIEW_PROVIDER:-}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-}
      LLM_REVIEW_REASONING_EFFORT: ${LLM_REVIEW_REASONING_EFFORT:-}
      LLM_REVIEW_THINKING_BUDGET: ${LLM_REVIEW_THINKING_BUDGET:-}
      LLM_ASSISTANT_PROVIDER: ${LLM_ASSISTANT_PROVIDER:-}
      LLM_ASSISTANT_MODEL: ${LLM_ASSISTANT_MODEL:-}
      LLM_ASSISTANT_REASONING_EFFORT: ${LLM_ASSISTANT_REASONING_EFFORT:-}
      LLM_ASSISTANT_THINKING_BUDGET: ${LLM_ASSISTANT_THINKING_BUDGET:-}
      LLM_FORMS_PROVIDER: ${LLM_FORMS_PROVIDER:-}
      LLM_FORMS_MODEL: ${LLM_FORMS_MODEL:-}
      LLM_FORMS_REASONING_EFFORT: ${LLM_FORMS_REASONING_EFFORT:-}
      LLM_FORMS_THINKING_BUDGET: ${LLM_FORMS_THINKING_BUDGET:-}
      LLM_EXTRACT_PROVIDER: ${LLM_EXTRACT_PROVIDER:-}
      LLM_EXTRACT_MODEL: ${LLM_EXTRACT_MODEL:-}
      LLM_EXTRACT_REASONING_EFFORT: ${LLM_EXTRACT_REASONING_EFFORT:-}
      LLM_EXTRACT_THINKING_BUDGET: ${LLM_EXTRACT_THINKING_BUDGET:-}
      LLM_EMAIL_PROVIDER: ${LLM_EMAIL_PROVIDER:-}
      LLM_EMAIL_MODEL: ${LLM_EMAIL_MODEL:-}
      LLM_EMAIL_REASONING_EFFORT: ${LLM_EMAIL_REASONING_EFFORT:-}
      LLM_EMAIL_THINKING_BUDGET: ${LLM_EMAIL_THINKING_BUDGET:-}
      APPLYPILOT_AI_DAILY_REQUESTS: ${APPLYPILOT_AI_DAILY_REQUESTS:-50}
      APPLYPILOT_DECISIONS_OBSERVER: ${APPLYPILOT_DECISIONS_OBSERVER:-0}
      APPLYPILOT_DECISIONS_DAILY_BUDGET: ${APPLYPILOT_DECISIONS_DAILY_BUDGET:-20}
      APPLYPILOT_SCHEDULE_DAILY_LIMIT: ${APPLYPILOT_SCHEDULE_DAILY_LIMIT:-20}
      APPLYPILOT_OAUTH_REDIRECT_BASE: ${APPLYPILOT_OAUTH_REDIRECT_BASE:-http://127.0.0.1:8765}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
    volumes:
      - ./docker-data/workspace:/data/workspace
      - ./docker-data/multi:/data/multi
      - ./docker-data/transfer:/transfer
    command: ["applypilot", "dashboard-serve", "--host", "0.0.0.0", "--port", "8765", "--multi-user"]
    restart: unless-stopped
